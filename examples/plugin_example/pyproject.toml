[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dnastore-xor-demo"
version = "0.1.0"
description = "Example third-party codec plugin for dnastore -- demonstrates the entry-point plugin mechanism, not a real encoding scheme."
requires-python = ">=3.10"
dependencies = ["dnastore"]

# This is the entire plugin contract: declare your codec class under
# the "dnastore.codecs" entry-point group. dnastore's
# discover_plugin_codecs() scans this at runtime via
# importlib.metadata -- no dnastore-side registration needed.
[project.entry-points."dnastore.codecs"]
xor_demo = "dnastore_xor_demo.codec:XorDemoCodec"

[tool.setuptools.packages.find]
include = ["dnastore_xor_demo*"]
