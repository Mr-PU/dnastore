name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: pip install -e ".[dev]"

      - name: Install demo plugin package (exercises plugin discovery)
        run: pip install --no-deps -e examples/plugin_example

      - name: Run pytest suite
        run: pytest -v

      - name: Run dependency-free smoke test
        run: python smoke_test.py

      - name: Run codec benchmark (sanity check, not a perf gate)
        run: python benchmarks/codec_comparison.py

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t dnastore .

      - name: Run smoke test in container
        run: docker run --rm dnastore python smoke_test.py