[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dnastore"
version = "0.1.0"
description = "A programmable storage abstraction over DNA: store(), retrieve(), delete(), update() -- with a simulator you can run today and a pluggable seam for real synthesis/sequencing hardware."
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10"
keywords = ["dna-storage", "bioinformatics", "storage", "erasure-coding", "fountain-code", "reed-solomon"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: System :: Archiving",
]
dependencies = []

[project.optional-dependencies]
vfs = ["fusepy>=3.0"]
bio = ["biopython>=1.80"]
dev = ["pytest>=7.0"]

[project.urls]
Homepage = "https://github.com/yourname/dnastore"
Repository = "https://github.com/yourname/dnastore"

[tool.hatch.build.targets.wheel]
packages = ["dnastore"]

[tool.pytest.ini_options]
testpaths = ["tests"]
